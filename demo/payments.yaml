# Demo cluster "payments-prod": mostly healthy, one deploy missing its ConfigMap.
apiVersion: v1
kind: Namespace
metadata: { name: payments }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ledger, namespace: payments, labels: { app: ledger } }
spec:
  replicas: 2
  selector: { matchLabels: { app: ledger } }
  template:
    metadata: { labels: { app: ledger } }
    spec:
      containers:
        - name: ledger
          image: nginx:1.27-alpine
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fraud-scorer, namespace: payments, labels: { app: fraud-scorer } }
spec:
  replicas: 2
  selector: { matchLabels: { app: fraud-scorer } }
  template:
    metadata: { labels: { app: fraud-scorer } }
    spec:
      containers:
        - name: scorer
          image: busybox:1.36
          command: [sh, -c, "while true; do sleep 3600; done"]
          envFrom: [{ configMapRef: { name: fraud-rules-v7 } }]
          resources: { requests: { cpu: 10m, memory: 16Mi } }
