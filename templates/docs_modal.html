{{define "docs_modal"}}
<!-- ── Docs modal: how KubeHealth works ────────────────────────────────────
     A grid diagram of the system. Pick a feature and only its path is drawn,
     numbered to match the steps in the side panel. Lines are routed through
     the gaps between boxes, never across them. -->
<div id="docs-overlay" class="dm-overlay" onclick="docsClose()" style="display:none"></div>
<div id="docs-modal" class="dm" role="dialog" aria-modal="true" aria-labelledby="dm-title" style="display:none">
  <div class="dm-head">
    <div>
      <h2 id="dm-title">How KubeHealth works</h2>
      <p>Pick a feature to trace its path. The numbers on the diagram match the steps.</p>
    </div>
    <button type="button" class="icon-btn dm-close" onclick="docsClose()" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  </div>
  <div class="dm-body">
    <div class="dm-diagram">
      <svg id="dm-svg" viewBox="0 0 1004 564" role="img" aria-labelledby="dm-svg-title">
        <title id="dm-svg-title">KubeHealth architecture: the browser talks to the KubeHealth server, which keeps one state per cluster and calls the Kubernetes API, the model server and local files.</title>
        <defs>
          <marker id="dm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="dm-arrowhead"/>
          </marker>
        </defs>
        <g id="dm-groups"></g>
        <g id="dm-nodes"></g>
        <g id="dm-edges"></g>
        <g id="dm-badges"></g>
      </svg>
      <p class="dm-legend">
        <span><svg width="34" height="10" aria-hidden="true"><line x1="1" y1="5" x2="27" y2="5" class="dm-edge-sample"/><path d="M26,1 L33,5 L26,9 z" class="dm-arrowhead"/></svg> the selected feature’s path</span>
        <span><span class="dm-num dm-num-inline" aria-hidden="true">1</span> a step, listed on the right</span>
        <span><span class="dm-dim-sample" aria-hidden="true"></span> not involved</span>
      </p>
    </div>
    <aside class="dm-panel">
      <div class="dm-features" id="dm-features" role="group" aria-label="Features"></div>
      <div class="dm-trace" id="dm-trace" aria-live="polite"></div>
    </aside>
  </div>
</div>

<style>
  .dm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 910; }
  .dm {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 911;
    width: min(1440px, 96vw); height: min(860px, 94vh);
    background: var(--raised); color: var(--text); border-radius: 28px;
    box-shadow: var(--shadow-3); flex-direction: column; overflow: hidden;
    font-family: var(--sans); line-height: 20px;
  }
  .dm-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 20px 16px 12px 24px; flex-shrink: 0;
  }
  .dm-head h2 { margin: 0; font: 400 24px/32px var(--sans); }
  .dm-head p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .dm-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 8px; padding: 0 12px 12px; }
  .dm-diagram { min-width: 0; min-height: 0; padding: 16px 20px; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 10px; overflow: auto; background: var(--bg); border-radius: 16px; }
  .dm-diagram > svg { width: 100%; height: auto; flex: 0 1 auto; min-height: 0; max-height: 640px; display: block; }
  .dm-legend { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1.6rem; font-size: 12.5px; color: var(--muted); }
  .dm-legend > span { display: inline-flex; align-items: center; gap: 0.45rem; }
  .dm-edge-sample { stroke: var(--accent-text); stroke-width: 1.6; stroke-dasharray: 5 4; }
  .dm-num-inline { display: inline-grid; width: 18px; height: 18px; font-size: 10.5px; margin: 0; }
  .dm-dim-sample { width: 26px; height: 14px; border-radius: 4px; border: 1px solid var(--border-2); background: var(--surface); opacity: 0.35; }
  .dm-panel { background: var(--container); border-radius: 16px; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
  .dm-features { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 16px; border-bottom: 1px solid var(--border); }
  .dm-feat {
    --sl: transparent;
    text-align: left; background: linear-gradient(var(--sl), var(--sl)); border: 1px solid var(--border-2); color: var(--text-2);
    border-radius: 8px; padding: 6px 10px; font: 500 13px/18px var(--sans); cursor: pointer;
  }
  .dm-feat:hover { --sl: color-mix(in srgb, currentColor 8%, transparent); }
  .dm-feat[aria-pressed="true"] { border-color: var(--sec-c); background-color: var(--sec-c); color: var(--on-sec-c); }
  .dm-feat:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dm-trace { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .dm-trace h3 { margin: 0; font: 500 16px/24px var(--sans); }
  .dm-sum { margin: 0; font-size: 13.5px; color: var(--muted); }
  .dm-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.7rem; }
  .dm-steps li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 0.25rem 0.6rem; font-size: 13.5px; }
  .dm-num {
    width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
    font-size: 11px; font-weight: 600; display: grid; place-items: center; margin-top: 1px;
  }
  .dm-tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
  .dm-tag { font: 500 11px/16px var(--sans); padding: 1px 8px; border-radius: 6px; background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text-2); }
  .dm-tag.k8s { background: var(--accent-bg); color: var(--accent-text); }
  .dm-tag.model { background: var(--warn-bg); color: var(--warn); }
  .dm-cost { margin: 0; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 0.8rem; }
  .dm-cost b { color: var(--text); font-weight: 600; }
  .dm-cost span { display: block; }

  /* Diagram */
  .dm-group { fill: none; stroke: var(--border-2); stroke-dasharray: 4 5; }
  .dm-group-label { fill: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
  .dm-node rect { fill: var(--container); stroke: var(--border-2); stroke-width: 1; transition: stroke 0.2s; }
  .dm-node { transition: opacity 0.2s; }
  .dm-node.dim { opacity: 0.3; }
  .dm-node.on rect { stroke: var(--accent-text); stroke-width: 1.5; }
  .dm-node .t { fill: var(--text); font-size: 12.5px; font-weight: 500; }
  .dm-node .s { fill: var(--muted); font-size: 10.5px; }
  .dm-node .i { fill: var(--muted); font-size: 11px; }
  .dm-node .i-mark { fill: var(--border-2); }
  .dm-edge { fill: none; stroke: var(--accent-text); stroke-width: 1.6; stroke-dasharray: 5 4; animation: dm-flow 1.1s linear infinite; }
  .dm-arrowhead { fill: var(--accent-text); }
  @keyframes dm-flow { to { stroke-dashoffset: -9; } }
  .dm-badge circle { fill: var(--accent); stroke: var(--bg); stroke-width: 2.5; }
  .dm-badge text { fill: var(--on-accent); font-size: 10px; font-weight: 600; }

  @media (max-width: 960px) {
    .dm-body { display: block; overflow-y: auto; }
    .dm-diagram { overflow-x: auto; overflow-y: visible; justify-content: flex-start; }
    .dm-diagram > svg { min-width: 760px; height: auto; flex: none; }
    .dm-legend { justify-content: flex-start; }
    .dm-panel { overflow: visible; margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .dm-edge { animation: none; } }
</style>

<script>
(function() {

  var COL = { B: [32, 148], A: [232, 156], P: [424, 150], Q: [614, 146], E: [822, 152] };

  var NODES = [
    { id: 'b-home', c: 'B', r: 1, t: 'Overview', s: 'brief and problems' },

    { id: 'p-problems', c: 'P', r: 1, t: 'Problem model', s: 'owners, tiers, patterns' },
    { id: 'p-brief', c: 'P', r: 2, t: 'Brief', s: 'facts + AI note' },
    { id: 'p-results', c: 'P', r: 3, t: 'AI & RCA results', s: 'cached per cluster' },
    { id: 'p-registry', c: 'P', r: 4, t: 'Cluster registry', s: 'one state per context' },
    { id: 'p-settings', c: 'P', r: 5, t: 'Runtime settings', s: 'in memory, model slots' },
    { id: 'q-worker', c: 'Q', r: 1, t: 'Worker', s: '1 list call every 2 s' },
    { id: 'q-cache', c: 'Q', r: 2, t: 'Event cache', s: 'namespaces + warnings' },
    { id: 'q-owners', c: 'Q', r: 3, t: 'Owner resolver', s: '≤ 2 lookups a second' },
    { id: 'e-k8s', c: 'E', r: 1, span: 3, t: 'Kubernetes API', s: 'active context',
      items: ['Events', 'Namespaces', 'Pods and logs', 'Workloads and owners', 'API discovery'] },
    { id: 'e-llm', c: 'E', r: 4, t: 'Model server', s: 'LM Studio or embedded' },
    { id: 'e-files', c: 'E', r: 5, t: 'Local files', s: 'kubeconfig, prefs.json' }
  ];

  // ── Features ────────────────────────────────────────────────────────────
  // Each edge: from, to, the step it belongs to, and its route as points.
  var TAG = { k8s: 'Kubernetes API', model: 'Model', mem: 'Memory', files: 'Local files', web: 'Browser' };
  var FEATURES = [
    { key: 'home', name: 'Overview',
      sum: 'How warnings become the ranked problems on the Overview.',
      steps: [
        ['The worker makes one list call every 2 s: every 10 s a cluster-wide list of Warning events, otherwise the stalest namespace’s events.', ['k8s']],
        ['The events go into the event cache, one entry per namespace, with the warning feed merged in.', ['mem']],
        ['The page asks for /api/home every 3 s; it also keeps the namespace rail current.', ['web']],
        ['The problem model groups the cached warnings by workload, ranks them by age and links patterns across namespaces.', ['mem']],
        ['Owners guessed from names are confirmed through ownerReferences, two lookups a second at most, cached for 30 min. A CronJob’s last success sets how long it has been failing.', ['k8s']]
      ],
      cost: ['<b>Kubernetes API:</b> one list call every 2 s, plus owner lookups while new problems appear.', '<b>Model:</b> none.'],
      edges: [
        { f: 'q-worker', t: 'e-k8s', n: 1, p: [[760, 154], [822, 154]] },
        { f: 'q-worker', t: 'q-cache', n: 2, p: [[687, 184], [687, 210]] },
        { f: 'b-home', t: 'a-home', n: 3, p: [[180, 154], [232, 154]] },
        { f: 'a-home', t: 'p-problems', n: 4, p: [[388, 154], [424, 154]] },
        { f: 'q-cache', t: 'p-problems', n: 4, p: [[614, 232], [600, 232], [600, 166], [574, 166]] },
        { f: 'p-problems', t: 'q-owners', n: 5, p: [[574, 178], [590, 178], [590, 318], [614, 318]] },
        { f: 'q-owners', t: 'e-k8s', n: 5, p: [[760, 326], [822, 326]] }
      ] },
    { key: 'status', name: 'Namespace status',
      sum: 'What you see when you pick a namespace in the rail.',
      steps: [
        ['The page swaps in the namespace’s objects without reloading, and asks for its live snapshot.', ['web']],
        ['The objects, ownership chains and recent warnings come from the event cache.', ['mem']],
        ['The snapshot lists Deployments, StatefulSets, DaemonSets, CronJobs, Jobs, Pods and volume claims, and picks out what is not ready. It is cached for 30 s.', ['k8s']]
      ],
      cost: ['<b>Kubernetes API:</b> seven list calls when you open a namespace, at most every 30 s.', '<b>Model:</b> none, unless you run the namespace AI analysis.'],
      edges: [
        { f: 'b-ns', t: 'a-tools', n: 1, p: [[180, 240], [204, 240], [204, 326], [232, 326]] },
        { f: 'a-tools', t: 'q-cache', n: 2, p: [[388, 318], [402, 318], [402, 283], [594, 283], [594, 240], [614, 240]] },
        { f: 'a-tools', t: 'e-k8s', n: 3, p: [[388, 336], [396, 336], [396, 373], [797, 373], [797, 340], [822, 340]] }
      ] },
    { key: 'brief', name: 'Brief',
      sum: 'The sentences above the problem list, and the model’s note on the top problem.',
      steps: [
        ['Every /api/home response carries the brief.', ['web']],
        ['The facts are computed from the ranked problems: where to start, what is new, what is linked, what is old. No model is involved.', ['mem']],

      edges: [
        { f: 'b-home', t: 'a-home', n: 1, p: [[180, 154], [232, 154]] },
        { f: 'a-home', t: 'p-problems', n: 1, p: [[388, 154], [424, 154]] },
        { f: 'p-problems', t: 'p-brief', n: 2, p: [[499, 184], [499, 210]] },
        { f: 'p-brief', t: 'e-k8s', n: 3, p: [[574, 248], [600, 248], [600, 283], [797, 283], [797, 262], [822, 262]] },
        { f: 'p-brief', t: 'e-llm', n: 4, p: [[574, 262], [590, 262], [590, 373], [791, 373], [791, 412], [822, 412]] }
      ] },
    { key: 'logs', name: 'Logs',
      sum: 'The Logs button on a Pod.',
      steps: [
        ['Logs calls /api/logs for the pod.', ['web']],
        ['The container is picked from the pod’s cached events.', ['mem']],
        ['The last lines come from Kubernetes: the current run, or the previous one when the container keeps crashing.', ['k8s']]
      ],
      cost: ['<b>Kubernetes API:</b> one pod GET and a log read per container.', '<b>Model:</b> none.'],
      edges: [
        { f: 'b-ns', t: 'a-tools', n: 1, p: [[180, 240], [204, 240], [204, 326], [232, 326]] },
        { f: 'a-tools', t: 'q-cache', n: 2, p: [[388, 318], [402, 318], [402, 283], [594, 283], [594, 240], [614, 240]] },
        { f: 'a-tools', t: 'e-k8s', n: 3, p: [[388, 336], [396, 336], [396, 373], [797, 373], [797, 340], [822, 340]] }
      ] },
    { key: 'correlate', name: 'Correlate',
      sum: 'Events anywhere in the cluster around the same time as an object’s events.',
      steps: [
        ['Correlate calls /api/correlate for the object.', ['web']],
        ['It scans every namespace’s cached events for anything within 5 minutes of the object’s events.', ['mem']]
      ],
      cost: ['<b>Kubernetes API:</b> none.', '<b>Model:</b> none. It only reads memory, so it is instant.'],
      edges: [
        { f: 'b-ns', t: 'a-tools', n: 1, p: [[180, 240], [204, 240], [204, 326], [232, 326]] },
        { f: 'a-tools', t: 'q-cache', n: 2, p: [[388, 318], [402, 318], [402, 283], [594, 283], [594, 240], [614, 240]] }
      ] },
    { key: 'ai', name: 'AI analysis',
      sum: 'The ✦ AI button on any object.',
      steps: [
        ['✦ AI starts an analysis through /api/ai/analyze, then polls for tokens every 500 ms.', ['web']],
        ['The analysis runs in the background and keeps the cluster it started on, even if you switch.', ['mem']],
        ['The prompt gets the object’s cached events…', ['mem']],
        ['…a live describe of the object and, for a Pod, its logs.', ['k8s']],
        ['The prompt streams to the model; tokens are stored as they arrive and the page shows them.', ['model']]
      ],
      cost: ['<b>Kubernetes API:</b> a describe, plus the pod’s logs.', '<b>Model:</b> one streamed call.'],
      edges: [
        { f: 'b-ns', t: 'a-ai', n: 1, p: [[180, 240], [232, 240]] },
        { f: 'a-ai', t: 'p-results', n: 2, p: [[388, 240], [402, 240], [402, 326], [424, 326]] },
        { f: 'p-results', t: 'q-cache', n: 3, p: [[574, 316], [594, 316], [594, 248], [614, 248]] },
        { f: 'p-results', t: 'e-k8s', n: 4, p: [[574, 336], [600, 336], [600, 369], [797, 369], [797, 336], [822, 336]] },

      ],
      cost: ['<b>Kubernetes API:</b> a describe and logs to start, more for each tool call.', '<b>Model:</b> one call per round.'],
      edges: [
        { f: 'b-ns', t: 'a-ai', n: 1, p: [[180, 240], [232, 240]] },
        { f: 'a-ai', t: 'p-results', n: 2, p: [[388, 240], [402, 240], [402, 326], [424, 326]] },
        { f: 'p-results', t: 'q-cache', n: 3, p: [[574, 316], [594, 316], [594, 248], [614, 248]] },
        { f: 'p-results', t: 'e-k8s', n: 3, p: [[574, 336], [600, 336], [600, 369], [797, 369], [797, 336], [822, 336]] },
        { f: 'p-results', t: 'e-llm', n: 4, p: [[499, 356], [499, 377], [791, 377], [791, 412], [822, 412]] }
      ] },
    { key: 'switch', name: 'Switch cluster',
      sum: 'Picking another kubeconfig context in the header.',
      steps: [
        ['The context menu calls /api/contexts, which reads the kubeconfig again, so new credentials show up without a restart.', ['web', 'files']],
        ['Picking a context calls /api/context. Your kubeconfig’s current-context is never changed.', ['web']],
        ['The registry stops the old cluster’s worker (its caches stay in memory, so switching back is instant) and starts or resumes the new one.', ['mem']],
        ['The new worker starts listing that cluster’s events.', ['k8s']]
      ],
      cost: ['<b>Kubernetes API:</b> the new cluster’s worker starts at one call every 2 s; the old one stops.', '<b>Model:</b> none.'],
      edges: [
        { f: 'b-header', t: 'a-ctx', n: 1, p: [[180, 412], [232, 412]] },
        { f: 'a-ctx', t: 'e-files', n: 1, p: [[388, 430], [396, 430], [396, 455], [797, 455], [797, 490], [822, 490]] },

      edges: [
        { f: 'b-modals', t: 'a-set', n: 1, p: [[180, 498], [232, 498]] },
        { f: 'a-set', t: 'p-settings', n: 2, p: [[388, 498], [424, 498]] },
        { f: 'p-settings', t: 'e-files', n: 3, p: [[574, 498], [822, 498]] }
      ] }

  // ── Drawing ─────────────────────────────────────────────────────────────
  function el(name, attrs, text) {
    var e = document.createElementNS(SVG, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function box(n) {
    var c = COL[n.c], span = n.span || 1;
    return { x: c[0], y: ROW[n.r], w: c[1], h: ROW_H * span + GAP * (span - 1) };
  }

  // An orthogonal polyline with rounded corners.
  function route(pts) {
    var d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (var i = 1; i < pts.length - 1; i++) {
      var a = pts[i - 1], b = pts[i], c = pts[i + 1];
      var r = Math.min(6, Math.hypot(b[0] - a[0], b[1] - a[1]) / 2, Math.hypot(c[0] - b[0], c[1] - b[1]) / 2);
      var p1 = [b[0] - Math.sign(b[0] - a[0]) * r, b[1] - Math.sign(b[1] - a[1]) * r];
      var p2 = [b[0] + Math.sign(c[0] - b[0]) * r, b[1] + Math.sign(c[1] - b[1]) * r];
      d += ' L' + p1[0] + ',' + p1[1] + ' Q' + b[0] + ',' + b[1] + ' ' + p2[0] + ',' + p2[1];
    }
    var last = pts[pts.length - 1];
    return d + ' L' + last[0] + ',' + last[1];
  }
  // Where a step badge sits: on the longest segment, a little before its middle.
  function badgeAt(pts) {
    var best = 0, at = pts[0];
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (len > best) { best = len; at = [a[0] + (b[0] - a[0]) * 0.45, a[1] + (b[1] - a[1]) * 0.45]; }
    }
    return at;
  }

  var built = false, current = 'home';
  function build() {
    built = true;
    var groups = document.getElementById('dm-groups'), nodes = document.getElementById('dm-nodes');
    GROUPS.forEach(function(g) {
      groups.appendChild(el('rect', { x: g.x, y: g.y, width: g.w, height: g.h, rx: 12, 'class': 'dm-group' }));
      groups.appendChild(el('text', { x: g.x + 14, y: g.y + 20, 'class': 'dm-group-label' }, g.label));
    });
    NODES.forEach(function(n) {
      var b = box(n), g = el('g', { 'class': 'dm-node', id: 'dm-n-' + n.id });
      g.appendChild(el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 8 }));
      g.appendChild(el('text', { x: b.x + 12, y: b.y + 25, 'class': 't' }, n.t));
      g.appendChild(el('text', { x: b.x + 12, y: b.y + 43, 'class': 's' }, n.s));
      (n.items || []).forEach(function(item, i) {
        var y = b.y + 80 + i * 28;
        g.appendChild(el('rect', { x: b.x + 12, y: y - 8, width: 6, height: 6, rx: 1.5, 'class': 'i-mark' }));
        g.appendChild(el('text', { x: b.x + 26, y: y - 1, 'class': 'i' }, item));
      });
      nodes.appendChild(g);
    });
    var bar = document.getElementById('dm-features');
    FEATURES.forEach(function(f) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dm-feat';
      btn.dataset.key = f.key;
      btn.textContent = f.name;
      btn.addEventListener('click', function() { select(f.key); });
      bar.appendChild(btn);
    });
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function select(key) {
    current = key;
    var f = FEATURES.filter(function(x) { return x.key === key; })[0];
    var edges = document.getElementById('dm-edges'), badges = document.getElementById('dm-badges');
    edges.textContent = '';
    badges.textContent = '';
    var on = {};
    f.edges.forEach(function(e) {
      on[e.f] = on[e.t] = true;
      edges.appendChild(el('path', { d: route(e.p), 'class': 'dm-edge', 'marker-end': 'url(#dm-arrow)' }));
      var at = badgeAt(e.p), g = el('g', { 'class': 'dm-badge' });
      g.appendChild(el('circle', { cx: at[0], cy: at[1], r: 8.5 }));
      g.appendChild(el('text', { x: at[0], y: at[1] + 3.5, 'text-anchor': 'middle' }, String(e.n)));
      badges.appendChild(g);
    });
    NODES.forEach(function(n) {
      var g = document.getElementById('dm-n-' + n.id);
      g.classList.toggle('on', !!on[n.id]);
      g.classList.toggle('dim', !on[n.id]);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.dm-feat'), function(b) {
      b.setAttribute('aria-pressed', String(b.dataset.key === key));
    });
    var html = '<h3>' + esc(f.name) + '</h3><p class="dm-sum">' + esc(f.sum) + '</p><ol class="dm-steps">';
    f.steps.forEach(function(s, i) {
      html += '<li><span class="dm-num" aria-hidden="true">' + (i + 1) + '</span><span>' + esc(s[0]) + '</span>' +
        '<span class="dm-tags">' + s[1].map(function(t) { return '<span class="dm-tag ' + t + '">' + TAG[t] + '</span>'; }).join('') + '</span></li>';
    });
    html += '</ol><p class="dm-cost">' + f.cost.map(function(c) { return '<span>' + c + '</span>'; }).join('') + '</p>';
    document.getElementById('dm-trace').innerHTML = html;
  }

  window.docsOpen = function() {
    if (!built) build();
    select(current);
    document.getElementById('docs-overlay').style.display = '';
    document.getElementById('docs-modal').style.display = 'flex';
    var pressed = document.querySelector('.dm-feat[aria-pressed="true"]');
    if (pressed) pressed.focus();
  };
  window.docsClose = function() {
    document.getElementById('docs-overlay').style.display = 'none';
    document.getElementById('docs-modal').style.display = 'none';
  };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('docs-modal').style.display !== 'none') docsClose();
  });
})();
</script>
