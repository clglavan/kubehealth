apiVersion: v1
items:
- apiVersion: batch/v1
  kind: CronJob
  metadata:
    creationTimestamp: "2026-10-17T20:14:09Z"
    generation: 1
    name: catalog-sync
    namespace: catalog
    resourceVersion: "23240"
    uid: 960e0491-4fee-42fc-8d37-f690f995615f
  spec:
    concurrencyPolicy: Forbid
    failedJobsHistoryLimit: 3
    jobTemplate:
      metadata: {}
      spec:
        backoffLimit: 1
        template:
          metadata: {}
          spec:
            containers:
            - command:
              - sh
              - -c
              - |
                echo "$(date -u +%FT%TZ) INFO  catalog-sync 3.2.0: fetching supplier feed"
                echo "$(date -u +%FT%TZ) INFO  GET https://api.supplier.example/v2/feed?since=last_run"
                sleep 1
                echo "$(date -u +%FT%TZ) ERROR supplier API returned 401 Unauthorized: token expired at 2026-10-14T00:00:00Z"
                echo "$(date -u +%FT%TZ) ERROR sync aborted, 0 of 18,240 products updated"
                exit 1
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              name: sync
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
            dnsPolicy: ClusterFirst
            restartPolicy: Never
            schedulerName: default-scheduler
            securityContext: {}
            terminationGracePeriodSeconds: 30
    schedule: '*/1 * * * *'
    successfulJobsHistoryLimit: 1
    suspend: false
  status:
    lastScheduleTime: "2026-10-18T07:04:00Z"
    lastSuccessfulTime: "2026-10-15T07:03:30Z"
kind: List
