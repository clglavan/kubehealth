            echo "$(date -u +%FT%TZ) INFO  orders-worker v1.8.2 starting"
            echo "$(date -u +%FT%TZ) INFO  loading config from /etc/orders/config.yaml"
            echo "$(date -u +%FT%TZ) INFO  connecting to postgres at orders-db.orders.svc:5432 (db=orders)"
