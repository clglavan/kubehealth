apiVersion: v1
kind: Namespace
metadata: {name: tidepool-ingest, labels: {team: ocean-data}}
---
apiVersion: v1
kind: Service
metadata: {name: swell-primary, namespace: tidepool-ingest, labels: {app: swell-primary}}
spec:
  selector: {app: swell-primary}
  ports: [{name: replication, port: 5433, targetPort: 5433}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: swell-primary, namespace: tidepool-ingest, labels: {app: swell-primary}}
spec:
  serviceName: swell-primary
  replicas: 1
  selector: {matchLabels: {app: swell-primary}}
  template:
    metadata: {labels: {app: swell-primary}}
    spec:
      nodeSelector: {disktype: nvme}
      containers:
        - name: store
          image: harbor.tidepool.internal/ocean/swell-store:1.8.2
          args: ["--role=primary"]
          ports: [{containerPort: 5433}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: swell-replica, namespace: tidepool-ingest, labels: {app: swell-replica}}
spec:
  serviceName: swell-replica
  replicas: 1
  selector: {matchLabels: {app: swell-replica}}
  template:
    metadata: {labels: {app: swell-replica}}
    spec:
      containers:
        - name: store
          image: harbor.tidepool.internal/ocean/swell-store:1.8.2
          args: ["--role=replica", "--primary=swell-primary.tidepool-ingest.svc:5433"]
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
