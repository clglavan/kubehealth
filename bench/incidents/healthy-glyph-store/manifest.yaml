apiVersion: v1
kind: Namespace
metadata: {name: quillmoss-render, labels: {team: print-studio}}
---
apiVersion: v1
kind: Service
metadata: {name: glyph-store, namespace: quillmoss-render, labels: {app: glyph-store}}
spec:
  clusterIP: None
  selector: {app: glyph-store}
  ports: [{name: store, port: 7000}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: glyph-store, namespace: quillmoss-render, labels: {app: glyph-store}}
spec:
  serviceName: glyph-store
  replicas: 1
  selector: {matchLabels: {app: glyph-store}}
  template:
    metadata: {labels: {app: glyph-store}}
    spec:
      containers:
        - name: store
          image: harbor.quillmoss.internal/render/glyph-store:1.0.6
          ports: [{containerPort: 7000}]
          readinessProbe: {tcpSocket: {port: 7000}, periodSeconds: 10}
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
          volumeMounts: [{name: glyphs, mountPath: /var/lib/glyphs}]
  volumeClaimTemplates:
    - metadata: {name: glyphs}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources: {requests: {storage: 1Gi}}
