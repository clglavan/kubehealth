apiVersion: v1
kind: Namespace
metadata: {name: tidepool-ingest, labels: {team: ocean-data}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kelp-archive, namespace: tidepool-ingest}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kelp-archiver, namespace: tidepool-ingest, labels: {app: kelp-archiver}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: kelp-archiver}}
  template:
    metadata: {labels: {app: kelp-archiver}}
    spec:
      containers:
        - name: archiver
          image: harbor.tidepool.internal/ocean/kelp-archiver:1.2.0
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
          volumeMounts: [{name: archive, mountPath: /archive}]
      volumes:
        - name: archive
          persistentVolumeClaim: {claimName: kelp-archive}
