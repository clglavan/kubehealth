apiVersion: v1
kind: Namespace
metadata: {name: quillmoss-ops, labels: {team: print-studio}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ink-proofer, namespace: quillmoss-ops, labels: {app: ink-proofer}}
spec:
  replicas: 1
  selector: {matchLabels: {app: ink-proofer}}
  template:
    metadata: {labels: {app: ink-proofer}}
    spec:
      containers:
        - name: proofer
          image: harbor.quillmoss.internal/ops/ink-proofer:1.3.1
          args: ["--queue=ink-queue:5672", "--prefetch=8"]
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
