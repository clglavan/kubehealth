apiVersion: v1
kind: Namespace
metadata: {name: quillmoss-render, labels: {team: print-studio}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: stencil-cdn, namespace: quillmoss-render, labels: {app: stencil-cdn}}
spec:
  replicas: 2
  selector: {matchLabels: {app: stencil-cdn}}
  template:
    metadata: {labels: {app: stencil-cdn}}
    spec:
      nodeSelector: {node-pool: reporting}
      tolerations: [{key: dedicated, operator: Equal, value: reporting, effect: NoSchedule}]
      containers:
        - name: cdn
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
