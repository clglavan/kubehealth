apiVersion: v1
kind: Namespace
metadata: {name: tidepool, labels: {team: ocean-data}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sediment-scratch, namespace: tidepool}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: standard
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sediment-cache, namespace: tidepool, labels: {app: sediment-cache}}
spec:
  replicas: 1
  selector: {matchLabels: {app: sediment-cache}}
  template:
    metadata: {labels: {app: sediment-cache}}
    spec:
      containers:
        - name: cache
          image: nginx:1.27-alpine
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts: [{name: scratch, mountPath: /var/cache/sediment}]
      volumes:
        - name: scratch
          persistentVolumeClaim: {claimName: sediment-scratch}
