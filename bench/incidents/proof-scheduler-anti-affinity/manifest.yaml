apiVersion: v1
kind: Namespace
metadata: {name: quillmoss-render, labels: {team: print-studio}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: proof-scheduler, namespace: quillmoss-render, labels: {app: proof-scheduler}}
spec:
  replicas: 3
  selector: {matchLabels: {app: proof-scheduler}}
  template:
    metadata: {labels: {app: proof-scheduler}}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: proof-scheduler}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: scheduler
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
