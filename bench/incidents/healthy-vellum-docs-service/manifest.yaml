apiVersion: v1
kind: Namespace
metadata: {name: quillmoss-render, labels: {team: print-studio}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vellum-docs, namespace: quillmoss-render, labels: {app: vellum-docs}}
spec:
  replicas: 2
  selector: {matchLabels: {app: vellum-docs}}
  template:
    metadata: {labels: {app: vellum-docs}}
    spec:

      containers:
        - name: docs
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: vellum-docs, namespace: quillmoss-render, labels: {app: vellum-docs}}
spec:
  selector: {app: vellum-docs}
  ports: [{name: http, port: 80, targetPort: 80}]
