apiVersion: v1
kind: Namespace
metadata: {name: quillmoss-ops, labels: {team: print-studio}}
---
apiVersion: v1
kind: Secret
metadata: {name: pigment-db, namespace: quillmoss-ops}
type: Opaque
stringData:
  username: pigment
  passwd: kh-bench-not-a-real-password-7731
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pigment-api, namespace: quillmoss-ops, labels: {app: pigment-api}}
spec:
  replicas: 1
  selector: {matchLabels: {app: pigment-api}}
  template:
    metadata: {labels: {app: pigment-api}}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: pigment-db, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: pigment-db, key: password}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
