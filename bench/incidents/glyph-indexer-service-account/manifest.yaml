apiVersion: v1
kind: Namespace
metadata: {name: quillmoss-ops, labels: {team: print-studio}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: glyph-indexer, namespace: quillmoss-ops, labels: {app: glyph-indexer}}
spec:
  replicas: 1
  selector: {matchLabels: {app: glyph-indexer}}
  template:
    metadata: {labels: {app: glyph-indexer}}
    spec:
      serviceAccountName: glyph-indexer
      containers:
        - name: indexer
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
