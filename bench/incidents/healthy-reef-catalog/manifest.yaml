apiVersion: v1
kind: Namespace
metadata: {name: tidepool, labels: {team: ocean-data}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reef-catalog, namespace: tidepool, labels: {app: reef-catalog}}
spec:
  replicas: 2
  selector: {matchLabels: {app: reef-catalog}}
  template:
    metadata: {labels: {app: reef-catalog}}
    spec:
      containers:
        - name: catalog
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 10}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: reef-catalog, namespace: tidepool}
spec:
  selector: {app: reef-catalog}
  ports: [{port: 80, targetPort: 80}]
