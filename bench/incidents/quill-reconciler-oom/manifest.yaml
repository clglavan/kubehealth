apiVersion: v1
kind: Namespace
metadata: {name: larkspur-books, labels: {team: finance-platform}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: quill-reconciler, namespace: larkspur-books, labels: {app: quill-reconciler}}
spec:
  replicas: 1
  selector: {matchLabels: {app: quill-reconciler}}
  template:
    metadata: {labels: {app: quill-reconciler}}
    spec:
      containers:
        - name: reconciler
          image: harbor.larkspur.internal/books/quill-reconciler:1.9.0
          args: ["--period=2026-10", "--accounts=all"]
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 64Mi}}
