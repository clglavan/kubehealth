apiVersion: v1
kind: Namespace
metadata: {name: quillmoss-ops, labels: {team: print-studio}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: font-syncer, namespace: quillmoss-ops}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: font-syncer, namespace: quillmoss-ops, labels: {app: font-syncer}}
spec:
  replicas: 1
  selector: {matchLabels: {app: font-syncer}}
  template:
    metadata: {labels: {app: font-syncer}}
    spec:
      serviceAccountName: font-syncer
      containers:
        - name: syncer
          image: registry.k8s.io/kubectl:v1.34.1
          args: ["get", "configmaps", "--namespace=quillmoss-ops", "--selector=quillmoss.io/font-set", "--output=name"]
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 64Mi}}
